account:
  capital: 7000000
  currency: INR

risk:
  per_trade_pct: 0.0075
  concurrent_open_pct: 0.03
  daily_stop_pct: 0.02
  monthly_stop_pct: 0.06
  margin_util_cap: 0.60
  correlation_max: 0.70

targets:
  monthly_net_pct: 0.05
  weekly_net_pct: 0.0125

indices:
  - NIFTY
  - BANKNIFTY

sectors:
  - NIFTY IT
  - NIFTY BANK
  - NIFTY AUTO
  - NIFTY PHARMA
  - NIFTY FMCG
  - NIFTY METAL
  - NIFTY ENERGY
  - NIFTY REALTY
  - NIFTY INFRA
  - NIFTY PSE
  - NIFTY PVT BANK

universe_source: fno200 # fno200 | fo_sample
intraday_top_n: 30

universe_fo_sample:
  - RELIANCE
  - HDFCBANK
  - ICICIBANK
  - INFY
  - TCS
  - LT
  - SBIN
  - AXISBANK
  - KOTAKBANK
  - ITC
  - HINDUNILVR
  - BHARTIARTL
  - MARUTI
  - M&M
  - SUNPHARMA
  - BAJFINANCE
  - ASIANPAINT
  - TITAN
  - ADANIENT

schedule_ist:
  morning_dashboard: "08:45"
  entry_window_open: "09:20"
  midday_check: "12:30"
  eod_review: "15:20"

broker:
  provider: dhan # kite | dhan | fyers
  api_key: "${BROKER_API_KEY}"
  api_secret: "${BROKER_API_SECRET}"
  access_token: "${BROKER_ACCESS_TOKEN}"
  dhan:
    client_id: "${DHAN_CLIENT_ID}"
    access_token: "${DHAN_ACCESS_TOKEN}"

alerts:
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"

paths:
  journal_db: "./data/journal.sqlite"
  cache_dir: "./data/cache"

data_sources:
  dhan:
    enabled: false # Dhan API is not subscribed (paid). Using Dhan Public scraper instead.
    primary: false
    instrument_master_url: "https://images.dhan.co/api-data/api-scrip-master.csv"
    underlyings:
      NIFTY: { security_id: 13, segment: IDX_I }
      BANKNIFTY: { security_id: 25, segment: IDX_I }
      FINNIFTY: { security_id: 27, segment: IDX_I }

  local_files:
    option_chain: "./data/manual/option_chain_NIFTY.csv"

  scrapegraphai:
    enabled: true
    model: "google_genai/gemini-2.5-flash-lite"
    model_tokens: 8192
    api_key: "${GOOGLE_API_KEY}"
    bedrock_api_key: "${BEDROCK_API_KEY}"
    groq_api_key: "${GROQ_API_KEY}"
    openrouter_api_key: "${OPENROUTER_API_KEY}"
    sambanova_api_key: "${SAMBANOVA_API_KEY}"
    saas_api_key: "${SCRAPEGRAPHAI_API_KEY}"
    opencode_api_key: "${OPENCODE_API_KEY}"
    nvidia_api_key: "${NVIDIA_API_KEY}"

options:
  enabled: true
  underlyings: [NIFTY, BANKNIFTY]
  lot_size: { NIFTY: 65, BANKNIFTY: 30, FINNIFTY: 60 }
  strike_step: { NIFTY: 50, BANKNIFTY: 100 }
  expiry_preference: weekly # weekly | monthly
  max_risk_per_structure_pct: 0.0075
  max_concurrent_structures: 10
  iv_history_db: ./data/iv_history.sqlite # Per user choice - initial structures
  enabled_structures:
    - BULL_CALL_SPREAD
    - BEAR_PUT_SPREAD
    - LONG_STRADDLE
    - SHORT_STRANGLE_WINGED # short strangle + protective wings (defined risk)

# NIFTY Option Selling - Defined Risk Only
nifty_options:
  enabled: true
  # Minimum lot count per leg (10 means 10 * lot_size contracts per leg)
  min_lots_per_leg: 10
  # Trade modes: intraday | positional
  mode: positional
  # Intraday window
  intraday_entry_start: "09:45"
  intraday_entry_end: "14:30"
  intraday_exit_by: "15:25"
  # Positional window - All weekdays enabled for paper trading (0=Mon, 4=Fri)
  positional_entry_days: [0, 1, 2, 3, 4]
  positional_exit_expiry_cutoff: "15:15"
  # Max concurrent NIFTY structures
  max_nifty_structures: 2
  # Strategy wings
  iron_condor_wing_width: 300 # Rs distance for Iron Condor wings
  spread_width: 200 # Rs distance for credit spreads
  # Risk per structure (% of account capital)
  max_risk_per_pct: 0.01 # 1% max risk per NIFTY structure
  # Avoid conditions
  avoid_vol_expansion: true # Don't sell when VIX expanding
  vol_expansion_threshold: 5.0 # % VIX change to block entry
  # Exit rules
  profit_take_pct: 0.50 # Book profit at 50% of max credit
  stop_loss_mult: 1.0 # Stop loss at 1.0x credit received
  vix_spike_exit_pct: 10.0 # Close if VIX jumps >10% intraday
  # Minimum short-leg premium (per share): skip strikes where premium < this
  #   (walk TOWARDS ATM to get adequate credit; reject if ATM also below floor)
  min_short_premium: 15.0
  # Maximum short-leg premium (per share): skip strikes where premium >= this
  #   (walk further OTM to reduce risk; reject if can't get below cap)
  max_short_premium: 150.0

# BANKNIFTY Option Selling - Defined Risk Only
banknifty_options:
  enabled: true
  min_lots_per_leg: 5
  mode: positional
  intraday_entry_start: "09:45"
  intraday_entry_end: "14:30"
  intraday_exit_by: "15:25"
  positional_entry_days: [0, 1, 2, 3, 4]
  positional_exit_expiry_cutoff: "15:15"
  max_banknifty_structures: 2
  iron_condor_wing_width: 600
  spread_width: 400
  max_risk_per_pct: 0.01
  avoid_vol_expansion: true
  vol_expansion_threshold: 5.0
  profit_take_pct: 0.50
  stop_loss_mult: 1.25
  vix_spike_exit_pct: 10.0
  min_short_premium: 15.0
  max_short_premium: 500.0

# FII Derivatives Thresholds (₹Cr) for bias scoring
# Normalized by 5-day rolling average volume in future enhancement
fii_derivatives_thresholds:
  index_futures_5d_cr: 1000
  index_options_5d_cr: 2000
  stock_futures_5d_cr: 2000

# FII Derivatives Thresholds (₹Cr) - configurable to normalize across expiry weeks
fii_derivatives_thresholds:
  index_futures_5d_cr: 1000.0
  index_options_5d_cr: 2000.0
  stock_futures_5d_cr: 2000.0

# Timing Engine - Overextension & Market Exhaustion Filters
timing_engine:
  enabled: true
  sentiment_refresh_minutes: 20

  late_entry_filter:
    enabled: true
    # Price must be within X% of VWAP (e.g., 1.0%)
    max_vwap_dist_pct: 1.0
    # RSI levels: LONG fails if RSI > threshold, SHORT fails if RSI < threshold
    rsi_threshold_long: 70
    rsi_threshold_short: 30
    # Price distance from day open (avoid chasing after big gaps)
    max_move_from_open_pct: 1.2
    # Max extension in ATRs from open (1.0 = 1 ATR away from open)
    max_intraday_atr_extension: 1.0

  market_exhaustion:
    enabled: true
    # Breadth ratio threshold (advances drop >X% of prior 20-session avg)
    breadth_drop_threshold_pct: 8
    # VIX intraday spike (>X% from yesterday close) signals risk-off
    vix_intraday_spike_pct: 5

  event_risk_mode:
    enabled: true
    # Reduce position size by this factor when event risk is elevated
    size_multiplier: 0.5
    # Soft cutoff: no new EQUITY entries after this time (option spreads allowed)
    no_fresh_equity_after: "11:30"
    # Trigger event-risk mode if sentiment flip (detected via AI review)
    sentiment_flip_cooldown_minutes: 30

  # [PHASE 2] AI Timing Review
  ai_review:
    enabled: false # Set to true after Phase 1 validation
    provider: groq # groq | gemini | openrouter
    model: "mixtral-8x7b-32768" # Groq model
    temperature: 0.3 # Deterministic responses
    timeout_sec: 3
    fallback_on_error: true

  # [PHASE 2] Dynamic Threshold Adjustment
  dynamic_thresholds:
    enabled: false # Set to true after Phase 1 analysis
    adjustment_rules:
      TREND_UP:
        # In uptrends, be more lenient on VWAP deviation
        max_vwap_dist_pct: 1.5
        rsi_threshold_long: 75
      TREND_DOWN:
        # In downtrends, stricter on shorts
        max_vwap_dist_pct: 0.8
        rsi_threshold_short: 25
      RANGE_LOW_VOL:
        # In ranges, tight around VWAP
        max_vwap_dist_pct: 0.7
        max_intraday_atr_extension: 0.7
      VOL_CONTRACTION:
        max_vwap_dist_pct: 0.9
        breadth_drop_threshold_pct: 5

  # [PHASE 2] Sentiment Tracking
  # Disabled: previous_sentiment is always None → detect_sentiment_flip() always
  # returns flip_detected=False, making the per-stock call pure overhead (~0.5s × N stocks).
  sentiment_tracking:
    enabled: false
    flip_detection: false
    flip_cooldown_minutes: 30
    tracking_window_trades: 20

  # [PHASE 2] Backtest Configuration
  backtest:
    enabled: true
    min_trades_for_analysis: 20
    correlation_threshold: 0.6
    output_dir: "./data/backtest"
